<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>

<body>
    <div class="container">
        <div class="nav">
            <h1>CarRental</h1>
            <div>
                <a href="">Home</a>
                <a href="">Cars</a>
                <a href="">My Bookings</a>
                <input type="search" placeholder="Search Cars">
                <a href="">List Cars</a>
                <button>Login</button>
            </div>
        </div>
        <div class="page1">
            <h1>Luxury cars on Rent</h1>
            <div class="whitecard">
                <div>
                    <span>Select Location</span>
                    <select name="" id="">
                        <option value="">Pickup Location</option>
                        <option value="">Udaipur</option>
                        <option value="">Rajsamand</option>
                        <option value="">Jaipur</option>
                    </select>

                </div>
                <div>
                    <span>Pick Up Date</span>
                    <input type="date">
                </div>
                <div>
                    <span>Return Date</span>
                    <input type="date">
                </div>

                <button>Search</button>

            </div>

            <img class="car1" src="Images/main_car-hpkzbezO.png">

        </div>
        <div class="page2">

            <div>
                <h1>Featured Vehicles</h1>
                <p>Explore our selection of premium vehicles available for your next adventure.</p>
            </div>

            <div class="cards">
                <div class="car-card">Car 1</div>
                <div class="car-card">Car 2</div>
                <div class="car-card">Car 3</div>
                <div class="car-card">Car 4</div>
                <div class="car-card">Car 5</div>
                <div class="car-card">Car 6</div>
            </div>

        </div>

    </div>
</body>

</html>
